import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

/* ═══════════ HELPERS ═══════════ */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const g=n=>Math.exp(-n*n);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=Math.random;
const MS=o=>new THREE.MeshStandardMaterial(o);

/* ═══════════ TERRAIN HEIGHT FIELD ═══════════ */
function terrainRaw(x,z){
  const blob=1-smooth(0.62,0.98,Math.hypot(x/105,(z+25)/88));
  const zs=30+0.0024*x*x;
  let h;
  if(z>=zs) h=Math.max(-2.7,(z-zs)*-0.16);
  else     h=Math.min(6,(zs-z)*0.30);
  const prom=23*g(x/13)*g((z+8)/20);
  const ridge=24*g((x-5)/48)*g((z+68)/40);
  const dPl=Math.hypot(x*1.12,(z+12)*0.92);
  const pm=smooth(26,36,dPl);
  let total=h+prom+ridge;
  total=lerp(20,total,pm);
  const nz=Math.sin(x*0.16+1.7)*Math.sin(z*0.135+0.6)*1.5
          +Math.sin(x*0.05-0.4)*Math.sin(z*0.045+1.2)*2.2
          +Math.sin(x*0.42+3.1)*Math.sin(z*0.37+0.2)*0.5;
  total+=nz*0.55*smooth(1.2,7,total)*(1-pm);
  return lerp(-2.7,total,blob);
}
const PATH=[[0,21,17.6],[5.5,21.4,15.2],[7,23,11],[3.5,24.2,9.6],[5.2,25.9,5.8],
            [9,26.6,5.0],[12.5,28.4,2.8],[16.2,29.7,.85],[19.8,31.05,0]];
const ROAD=[[0,-29],[6,-36],[1,-45],[8,-54],[0,-63],[6,-72],[-1,-81],[3,-90]];
const GR=[];
for(let i=0;i<PATH.length-1;i++)GR.push({x0:PATH[i][0],z0:PATH[i][1],y0:PATH[i][2],x1:PATH[i+1][0],z1:PATH[i+1][1],y1:PATH[i+1][2]});
for(let i=0;i<ROAD.length-1;i++)GR.push({x0:ROAD[i][0],z0:ROAD[i][1],y0:terrainRaw(ROAD[i][0],ROAD[i][1]),x1:ROAD[i+1][0],z1:ROAD[i+1][1],y1:terrainRaw(ROAD[i+1][0],ROAD[i+1][1])});
function terrainHeight(x,z){
  let h=terrainRaw(x,z);
  let ax=0,ay=0;
  for(let i=0;i<GR.length;i++){const s=GR[i];
    const dx=s.x1-s.x0,dz=s.z1-s.z0,L2=dx*dx+dz*dz||1e-9;
    let t=clamp(((x-s.x0)*dx+(z-s.z0)*dz)/L2,0,1);
    const d=Math.hypot(s.x0+dx*t-x,s.z0+dz*t-z);
    const w=Math.exp(-(d*d)/7.2);
    ax+=w;ay+=w*(s.y0+(s.y1-s.y0)*t);
  }
  if(ax>0.05)h=lerp(h,ay/ax,Math.min(0.9,ax));
  {
    const cx=clamp(x,-2.2,2.2),d=Math.hypot(x-cx,z-18.6);
    h-=5.2*Math.exp(-(d*d)/2.0)*clamp((h-9)/5,0,1);
  }
  return h;
}
function segDist(x,z,p){
  let best=1e9;
  for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];
    const dx=b[0]-a[0],dz=b[1]-a[1],L2=dx*dx+dz*dz||1e-9;
    const t=clamp(((x-a[0])*dx+(z-a[1])*dz)/L2,0,1);
    best=Math.min(best,Math.hypot(x-(a[0]+dx*t),z-(a[1]+dz*t)));
  }
  return best;
}

{

  for(let i=0;i<n;i++){

/* ═══════════ TEXTURES ═══════════ */
function noiseTex(rx,ry){
  const cv=document.createElement('canvas');cv.width=cv.height=128;
  const c=cv.getContext('2d');
  c.fillStyle='#cfcfcf';c.fillRect(0,0,128,128);
  for(let i=0;i<2600;i++){const v=150+(Math.random()*90|0);
    c.fillStyle='rgba('+v+','+v+','+v+',0.35)';
    c.fillRect(Math.random()*128,Math.random()*128,1+Math.random()*2.5,1+Math.random()*2.5);}
  for(let i=0;i<26;i++){c.strokeStyle='rgba(96,88,76,0.25)';c.beginPath();
    const x=Math.random()*128,y=Math.random()*128;c.moveTo(x,y);
    c.lineTo(x+(Math.random()*40-20),y+(Math.random()*40-20));c.stroke();}
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function plankTex(){
  const cv=document.createElement('canvas');cv.width=cv.height=64;
  const c=cv.getContext('2d');
  c.fillStyle='#8a6a40';c.fillRect(0,0,64,64);
  for(let y=0;y<64;y+=8){c.fillStyle='rgba(40,26,12,'+(0.25+Math.random()*0.3)+')';c.fillRect(0,y,64,2);
    c.fillStyle='rgba(40,26,12,0.5)';c.fillRect(Math.random()*60|0,y,1.5,8);}
  for(let i=0;i<170;i++){c.fillStyle='rgba(60,44,24,'+(Math.random()*0.25)+')';
    c.fillRect(Math.random()*64,Math.random()*64,3+Math.random()*12,1);}
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,2);t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

/* ═══════════ TERRAIN MESH ═══════════ */
{
  const geo=new THREE.PlaneGeometry(470,470,150,150);
  geo.rotateX(-Math.PI/2);
  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++)p.setY(i,terrainHeight(p.getX(i),p.getZ(i)));
  geo.computeVertexNormals();
  const nrm=geo.attributes.normal;
  const C=h=>new THREE.Color(h);
  const cG1=C(0x5d7c42),cG2=C(0x86975d),cF=C(0x49633a),cR1=C(0x8d8476),cR2=C(0x6f6a61),
        cS1=C(0xdccaa1),cS2=C(0xc7b28c),cW=C(0xa3946f);
  const cc=new THREE.Color(),tmp=new THREE.Color();
  const col=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),z=p.getZ(i),y=p.getY(i),ny=nrm.getY(i);
    const n1=Math.sin(x*.13+2.3)*Math.sin(z*.11+.7)*.5+.5;
    const n2=Math.sin(x*.31+.9)*Math.sin(z*.27+1.8)*.5+.5;
    cc.copy(cG1).lerp(cG2,.35+.65*n1);
    tmp.copy(cF);cc.lerp(tmp,smooth(-50,-28,z)*smooth(3.5,8,y)*0.75);
    let rw=1-smooth(.6,.82,ny);
    rw=Math.min(1,Math.max(rw,smooth(13,21,y)*.55,n2>0.7?(n2-0.7)*1.4*smooth(2,6,y):0));
    tmp.copy(cR1).lerp(cR2,n1);cc.lerp(tmp,rw);
    const sw=(1-smooth(1.2,3.2,y))*smooth(.45,.8,ny);
    tmp.copy(cS1).lerp(cS2,n2);cc.lerp(tmp,sw);
    cc.lerp(cW,(1-smooth(.1,.8,y))*0.75);
    col[i*3]=cc.r;col[i*3+1]=cc.g;col[i*3+2]=cc.b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.Mesh(geo,MS({vertexColors:true,roughness:.95,map:noiseTex(90,90)}));
  m.castShadow=m.receiveShadow=true;
  scene.add(m);
}

/* ═══════════ SEA ═══════════ */
let water;
{

/* ═══════════ MOUNTAINS (original flight sim) ═══════════ */
{
  const mtMat=new THREE.MeshLambertMaterial({color:0x5a7a5a});

    const r=15+Math.random()*30;

    mt.rotation.y=Math.random()*Math.PI;
    scene.add(mt);
  }
}

/* ═══════════ FOAM + SURF ═══════════ */
function foamSoftTex(){
  const cv=document.createElement('canvas');cv.width=cv.height=128;

  const gr=c.createRadialGradient(64,64,6,64,64,62);

  c.fillStyle=gr;c.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const foamTex=foamSoftTex();

{

   [76.5,7.5,2.6],[-76.5,5.5,2.4],[60,41,3],[-58,40.5,3]].forEach(r=>{

    m.renderOrder=3;m.userData.ph=rnd()*6.28;m.userData.s=r[2];

function ribbon(pts,width,yFn,lift,mat,order){
  const P=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz);
    const n=Math.max(1,Math.ceil(len/1.3));
    for(let j=0;j<n;j++)P.push([a[0]+dx*j/n,a[1]+dz*j/n]);
  }
  P.push(pts[pts.length-1]);
  const pos=[],idx=[];
  for(let i=0;i<P.length;i++){
    const p=P[i],q=P[Math.min(i+1,P.length-1)],o=P[Math.max(i-1,0)];
    let tx=q[0]-o[0],tz=q[1]-o[1];const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
    const lx=p[0]+tz*width/2,lz=p[1]-tx*width/2,rx=p[0]-tz*width/2,rz=p[1]+tx*width/2;
    pos.push(lx,yFn(lx,lz)+lift,lz, rx,yFn(rx,rz)+lift,rz);
    if(i<P.length-1){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(idx);
  const nrm=new Float32Array(pos.length);
  for(let i=0;i<nrm.length;i+=3){nrm[i+1]=1;}
  geo.setAttribute('normal',new THREE.BufferAttribute(nrm,3));
  const mesh=new THREE.Mesh(geo,mat);
  mesh.receiveShadow=true;if(order)mesh.renderOrder=order;
  scene.add(mesh);return mesh;
}
const surfMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,depthWrite:false,opacity:.5});
let surf1,surf2;
{
  const s1=[],s2=[];
  for(let x=-62;x<=62;x+=3.1)s1.push([x,30+0.0024*x*x+1.0]);

}

function box(w,h,d,x,y,z,mat,ry){
  const m=new THREE.Mesh(unitBox,mat);
  m.scale.set(w,h,d);m.position.set(x,y,z);if(ry)m.rotation.y=ry;
  m.castShadow=m.receiveShadow=true;scene.add(m);return m;
}
const MD=[];const dummy=new THREE.Object3D();
function merlon(x,y,z,ry){
  dummy.position.set(x,y,z);dummy.rotation.set(0,ry||0,0);
  dummy.scale.set(.95,.8,.42);dummy.updateMatrix();MD.push(dummy.matrix.clone());
}
function wallSeg(ax,az,bx,bz){
  const dx=bx-ax,dz=bz-az,len=Math.hypot(dx,dz);
  const ry=Math.atan2(-dz,dx);
  box(len+.6,6.4,1.5,(ax+bx)/2,23.2,(az+bz)/2,M.stone,ry);
  let nx=dz/len,nz=-dx/len;
  const cx=(ax+bx)/2,cz=(az+bz)/2;
  if(cx*nx+(cz+12)*nz<0){nx=-nx;nz=-nz;}
  const n=Math.max(2,Math.round(len/1.7));
  for(let i=1;i<n;i++){const t=i/n;
    merlon(ax+dx*t+nx*.55,26.82,az+dz*t+nz*.55,ry);}
}

{

}
function archGeo(w,h){
  const r=w/2,s=new THREE.Shape();
  s.moveTo(-r,0);s.lineTo(-r,h-r);
  s.absarc(0,h-r,r,Math.PI,0,true);
  s.lineTo(r,0);s.lineTo(-r,0);
  return new THREE.ShapeGeometry(s,10);

const clouds=[];
{
  const cloudMat=new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.NormalBlending,
    vertexShader:`
      attribute float alpha;
      attribute float size;
      varying float vA;
      void main(){
        vA=alpha;
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=size*(280.0/-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying float vA;
      void main(){
        float d=length(gl_PointCoord-0.5);
        if(d>0.5)discard;
        float soft=1.0-smoothstep(0.0,0.5,d);
        soft*=soft;
        gl_FragColor=vec4(1.0,1.0,1.0,vA*soft);
      }`
  });
  for(let c=0;c<35;c++){
    // size variety: small wisps to large cumulus
    const scale=rnd();
    const spread=scale<0.33?3+rnd()*4:scale<0.66?8+rnd()*8:18+rnd()*14;
    const n=scale<0.33?8+(rnd()*8|0):scale<0.66?25+(rnd()*20|0):45+(rnd()*30|0);
    const geo=new THREE.BufferGeometry();
    const pos=new Float32Array(n*3);
    const alp=new Float32Array(n);
    const siz=new Float32Array(n);
    const cx=rnd()*640-320,cy=55+rnd()*38,cz=rnd()*560-280;
    for(let i=0;i<n;i++){
      // cluster in a flattened ellipsoid
      const th=rnd()*Math.PI*2,ph=Math.acos(2*rnd()-1);
      const r=spread*(0.3+rnd()*0.7);
      pos[i*3]  =cx+r*Math.sin(ph)*Math.cos(th);
      pos[i*3+1]=cy+r*Math.cos(ph)*0.35;
      pos[i*3+2]=cz+r*Math.sin(ph)*Math.sin(th)*0.8;
      alp[i]=0.45+rnd()*0.45;
      siz[i]=6+rnd()*10;
    }
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    geo.setAttribute('alpha',new THREE.BufferAttribute(alp,1));
    geo.setAttribute('size',new THREE.BufferAttribute(siz,1));
    const pts=new THREE.Points(geo,cloudMat);
    pts.frustumCulled=false;
    pts.userData.sp=0.4+rnd()*1.0;
    scene.add(pts);clouds.push(pts);
  }
}

/* ═══════════ ANIMATION LOOP ═══════════ */
const clock=new THREE.Clock();
const wArr=water.geometry.attributes.position;
const flagArr=flagGeo.attributes.position;
const q=new THREE.Quaternion();
const _v=new THREE.Vector3();

renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  /* ── castle animations ── */
  {
    const a=wArr.array;
    for(let i=0;i<wArr.count;i++){
      const bx=a[i*3],bz=a[i*3+2];
      a[i*3+1]=.45*Math.sin(bx*.055+t*.85)+.3*Math.sin(bz*.042-t*.6+1.7)
              +.28*Math.sin((bx+bz)*.075+t*1.15)+.16*Math.sin(bx*.12-t*1.7)*Math.sin(bz*.1+t*1.25);
    }
    wArr.needsUpdate=true;
    water.geometry.computeVertexNormals();
  }
  surf1.material.opacity=.3+.22*(Math.sin(t*.9)+1)/2;
  surf2.material.opacity=.22+.18*(Math.sin(t*.72+2.1)+1)/2;
  surf1.position.z=Math.sin(t*.4)*1.1;
  surf2.position.z=Math.sin(t*.4+2.2)*1.1;
  for(const f of foams){
    const s=f.userData.s*(1+.25*Math.sin(t*1.3+f.userData.ph));
    f.scale.setScalar(s);
    f.material.opacity=.24+.24*(Math.sin(t*1.1+f.userData.ph)+1)/2;
  }
  for(const b of boats){
    const ph=b.userData.ph;
    b.position.y=.1+.16*Math.sin(t*.7+ph);
    b.rotation.x=.05*Math.sin(t*.65+ph);
    b.rotation.z=.04*Math.sin(t*.55+ph*1.3);
  }
  for(const c of clouds){c.position.x+=c.userData.sp*dt;if(c.position.x>340)c.position.x=-340;}
  {
    const p=flagArr.array;
    for(let i=0;i<flagArr.count;i++){
      const x=flagBase[i*3];
      p[i*3+2]=Math.sin(x*3-t*7)*.14*(x/2.4);
    }
    flagArr.needsUpdate=true;
  }

  /* ── flight controls ── */
  if(keys['KeyW'])speed=Math.min(speed+30*dt,100);
  if(keys['KeyS'])speed=Math.max(speed-30*dt,15);
  if(keys['ArrowUp']){q.setFromAxisAngle(_v.set(1,0,0),0.8*dt);plane.quaternion.multiply(q);elevatorPivot.rotation.x=Math.max(elevatorPivot.rotation.x-3*dt,-0.5);}
  if(keys['ArrowDown']){q.setFromAxisAngle(_v.set(1,0,0),-0.8*dt);plane.quaternion.multiply(q);elevatorPivot.rotation.x=Math.min(elevatorPivot.rotation.x+3*dt,0.5);}
  if(!keys['ArrowUp']&&!keys['ArrowDown'])elevatorPivot.rotation.x*=(1-5*dt);
  if(keys['KeyA']){q.setFromAxisAngle(_v.set(0,1,0),0.7*dt);plane.quaternion.multiply(q);rudderPivot.rotation.y=Math.max(rudderPivot.rotation.y-3*dt,-0.5);}
  if(keys['KeyD']){q.setFromAxisAngle(_v.set(0,1,0),-0.7*dt);plane.quaternion.multiply(q);rudderPivot.rotation.y=Math.min(rudderPivot.rotation.y+3*dt,0.5);}
  if(!keys['KeyA']&&!keys['KeyD'])rudderPivot.rotation.y*=(1-5*dt);
  if(keys['ArrowLeft']){q.setFromAxisAngle(_v.set(0,0,1),-1.0*dt);plane.quaternion.multiply(q);leftAileronPivot.rotation.x=Math.max(leftAileronPivot.rotation.x-3*dt,-0.5);rightAileronPivot.rotation.x=Math.min(rightAileronPivot.rotation.x+3*dt,0.5);}
  if(keys['ArrowRight']){q.setFromAxisAngle(_v.set(0,0,1),1.0*dt);plane.quaternion.multiply(q);leftAileronPivot.rotation.x=Math.min(leftAileronPivot.rotation.x+3*dt,0.5);rightAileronPivot.rotation.x=Math.max(rightAileronPivot.rotation.x-3*dt,-0.5);}
  if(!keys['ArrowLeft']&&!keys['ArrowRight']){leftAileronPivot.rotation.x*=(1-5*dt);rightAileronPivot.rotation.x*=(1-5*dt);}

  if(mouseDY!==0||mouseDX!==0){
    const pitchIn=-mouseDY*0.0025;
    const rollIn=mouseDX*0.003;
    if(Math.abs(pitchIn)>1e-4){
      q.setFromAxisAngle(_v.set(1,0,0),pitchIn);plane.quaternion.multiply(q);
      elevatorPivot.rotation.x=clamp(elevatorPivot.rotation.x+pitchIn*0.4,-0.5,0.5);
    }
    if(Math.abs(rollIn)>1e-4){
      q.setFromAxisAngle(_v.set(0,0,1),rollIn);plane.quaternion.multiply(q);
      leftAileronPivot.rotation.x=clamp(leftAileronPivot.rotation.x-rollIn*0.4,-0.5,0.5);
      rightAileronPivot.rotation.x=clamp(rightAileronPivot.rotation.x+rollIn*0.4,-0.5,0.5);
    }
    mouseDX=0;mouseDY=0;
  }

  camera.position.set(0,4*(camDist/14),-camDist);

  /* ── move ── */
  const dir=new THREE.Vector3(0,0,1).applyQuaternion(plane.quaternion);
  plane.position.addScaledVector(dir,speed*dt);
  plane.position.y-=5*dt;
  plane.position.y+=speed*0.15*dt;

  /* ── ground collision (terrain-aware) ── */
  const groundY=terrainHeight(plane.position.x,plane.position.z)+2;
  if(plane.position.y<groundY){
    plane.position.y=groundY;
    speed=Math.max(speed-40*dt,0);
  }

  /* ── soft ceiling ── */
  if(plane.position.y>500)plane.position.y=500;

  /* ── contrail ── */
  const rollDef=Math.abs(leftAileronPivot.rotation.x)+Math.abs(rightAileronPivot.rotation.x);
  const pitchDef=Math.abs(elevatorPivot.rotation.x);
  const totalDef=rollDef+pitchDef;
  if(totalDef>0.03){
    plane.updateMatrixWorld(true);
    const tailWP=new THREE.Vector3(0,0,-3.2).applyMatrix4(plane.matrixWorld);
    const laWP=new THREE.Vector3(-4.8,0,-0.3).applyMatrix4(plane.matrixWorld);
    const raWP=new THREE.Vector3(4.8,0,-0.3).applyMatrix4(plane.matrixWorld);
    const fwd=new THREE.Vector3(0,0,1).applyQuaternion(plane.quaternion);
    const intensity=Math.min(totalDef/0.5,1.0);
    let toSpawn=intensity*140*dt;
    let whole=Math.floor(toSpawn);
    if(Math.random()<toSpawn-whole)whole++;
    for(let s=0;s<whole;s++){
      const i=pIdx;pIdx=(pIdx+1)%PCOUNT;
      let sp;
      if(rollDef>0.03&&(pitchDef<0.03||Math.random()<rollDef/totalDef))
        sp=Math.random()<0.5?laWP:raWP;
      else sp=tailWP;
      const spread=0.4;
      pPos[i*3]=sp.x+(Math.random()-.5)*spread;
      pPos[i*3+1]=sp.y+(Math.random()-.5)*spread;
      pPos[i*3+2]=sp.z+(Math.random()-.5)*spread;
      pVel[i*3]=-fwd.x*4+(Math.random()-.5)*1.5;
      pVel[i*3+1]=-fwd.y*4+(Math.random()-.5)*0.5;
      pVel[i*3+2]=-fwd.z*4+(Math.random()-.5)*1.5;
      pLife[i]=1.0;
      pMaxLife[i]=0.6+Math.random()*0.6;
      pSize[i]=1.5+Math.random()*2.5;
      pBaseAlpha[i]=0.35+intensity*0.55;
    }
  }
  for(let i=0;i<PCOUNT;i++){
    if(pLife[i]<=0){pAlpha[i]=0;continue;}
    pLife[i]-=dt/pMaxLife[i];
    if(pLife[i]<0)pLife[i]=0;
    pPos[i*3]+=pVel[i*3]*dt;
    pPos[i*3+1]+=pVel[i*3+1]*dt;
    pPos[i*3+2]+=pVel[i*3+2]*dt;
    pAlpha[i]=pLife[i]*pBaseAlpha[i];
    pSize[i]+=3*dt;
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.alpha.needsUpdate=true;
  pGeo.attributes.size.needsUpdate=true;

  /* ── HUD ── */
  document.getElementById('alt').textContent=Math.round(plane.position.y);
  document.getElementById('spd').textContent=Math.round(speed*3.6);

  renderer.render(scene,camera);
});
</script>
</body>
</html>
